# Alpha04: autosave-entry fixes and a Vulkan occlusion-query compatibility test.
fnv_startup_barrier = true
# Keep passive counters; the alpha03 sampled run already identified CPU/GPU pressure.
switch_profile_stacks = false
# Return the SDK's fallback visible sample count instead of native occlusion queries.
# Experimental: test whether query handling contributes to the missing world.
occlusion_query_enable = false
render_target_path_vulkan = "fbo"
# Private observed shaders for black-world diagnosis and a future deko3d prototype.
dump_shaders = "/switch/FNV-nx/cache/shader-diagnostics-alpha04"
log_to_file = true
log_level = "info"
log_file = "/switch/FNV-nx/logs/fnv-nx.log"
asset_pack = false
asset_pack_build = false
allow_game_relative_writes = false

# Match the printed Switch button letters.
input_xbox_layout = false
