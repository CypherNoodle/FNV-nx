# Geometry capture using the FSI renderer that already showed the interior.
# This NRO still uses NVK; the capture supplies a separate native deko prototype.
fnv_startup_barrier = true
switch_profile_stacks = false
occlusion_query_enable = false
render_target_path_vulkan = "fsi"
fnv_capture_draws = true
log_to_file = true
log_level = "info"
log_file = "/switch/FNV-nx/logs/fnv-nx.log"
asset_pack = false
asset_pack_build = false
allow_game_relative_writes = false
dump_shaders = "/switch/FNV-nx/cache/deko-geometry-capture"
