; FNV-nx alpha12. Copiar junto a fnv-nx.nro; reiniciar despues de editar.
; Unico archivo de ajustes del port. fnv-nx.toml ya no se lee.
version=1

[graficos]
; 960x540 o 1280x720: tamano fijo al crear el renderer, no resolucion dinamica.
resolucion=960x540
; auto, off, on, relaxed: presentacion host. No altera el vblank de Xbox.
vsync=auto
; fsi conserva el mundo visible. fbo es experimental: tuvo mundo negro.
renderer=fsi

[optimizacion]
; Despertar por avance real del ring; timeout acotado y poll original intacto.
espera_gpu_notificada=true
backoff_gpu=true
; Prueba optativa: agrupa buffers y envia al presentar o antes de esperar.
; Conserva fences, barriers y lecturas GPU. No garantiza una mejora de FPS.
agrupar_envios_gpu=false

[cpu]
; auto usa la afinidad del runtime. 0, 1 o 2 fija solo ese hilo/grupo.
; No cambia prioridades ni abre el nucleo reservado. Por defecto dejar auto.
principal=auto
comandos_gpu=auto
audio=auto

[pantalla]
; Contador propio de frames del juego, sin abrir el overlay de ImGui.
mostrar_fps=true

[diagnostico]
tiempos_cpu=true
; Muestreo GPU reducido; desactivar para comparar rendimiento sin queries.
tiempos_gpu=true
traza_guardado=true
; Solo diagnostico: pausa hilos al muestrear y altera el rendimiento.
stacks_cpu=false
