# Alpha11: fixed creation-size experiment, not dynamic resolution.
fnv_startup_barrier = true
fnv_fixed_render_mode = true
fnv_render_width = 960
fnv_render_height = 540
fnv_call_profile = true
fnv_save_trace = true
# Automatic stall sampling is separate; ordinary frame counters remain passive.
fnv_profile_lowfps = false
switch_profile_stacks = false
fnv_gpu_wait_backoff = true
occlusion_query_enable = false
render_target_path_vulkan = "fsi"
video_mode_width = 1280
video_mode_height = 720
resolution_scale = 1
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1
vblank_per_swap = false
clock_no_scaling = false
clock_source_raw = false
diag_vdswap_delay_us = 0
sa2_io_us_per_kb = 0
log_to_file = true
log_level = "info"
log_file = "/switch/FNV-nx/logs/fnv-nx.log"
asset_pack = false
asset_pack_build = false
allow_game_relative_writes = false
dump_shaders = ""
fnv_capture_draws = false
fnv_capture_textures = false
input_xbox_layout = false
