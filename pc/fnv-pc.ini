; FNV-nx PC: primera prueba del motor original, no una demo de imagen.
; Se lee al arrancar. No usa la configuracion Xbox.
[runtime]
cpu=fex
renderer=dxvk
profile=1
verbose=0
; El cuarto nucleo requiere permisos del forwarder. Empezar con tres.
four_cores=0
; labels: A/B/X/Y coinciden con el texto del juego; positions: esquema Xbox.
button_layout=labels

[graphics]
fps=1
vsync=0
frame_limit=30
presentation=framebuffer
; Pares admitidos: 640/360, 960/540, 1280/720. Resolucion interna, MSAA=0.
width=960
height=540

